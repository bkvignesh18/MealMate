{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Menu - MealMate</title>
    <link rel="stylesheet" href="{% static 'delivery/menu_style.css' %}">
</head>
<body>
    <div class="form-container">
        <h2>Current Menu</h2>
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
            <thead>
                <tr style="background-color: #f0f0f0;">
                    <th style="text-align: left; padding: 8px;">Item Name</th>
                    <th style="text-align: left; padding: 8px;">Picture</th>
                    <th style="text-align: left; padding: 8px;">Description</th>
                    <th style="text-align: left; padding: 8px;">Price</th>
                    <th style="text-align: left; padding: 8px;">Is Veg</th>
                </tr>
            </thead>
            <tbody>
                {% for item in itemList %}
                <tr style="border-top: 1px solid #ccc;">
                    <td style="padding: 8px;">{{ item.name }}</td>
                    <td style="padding: 8px;">
                        <img src="{{ item.image_url }}" alt="{{ item.name }}" style="width: 100px; height: 60px; object-fit: cover; border-radius: 4px;">
                    </td>
                    <td style="padding: 8px;">{{ item.description }}</td>
                    <td style="padding: 8px;">₹{{ item.price }}</td>
                    <td style="padding: 8px;">{{ item.vegeterian }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <h2>Add Menu Item</h2>
        <form action="{% url 'update_menu' r.id %}" method="post">
            {% csrf_token %}

            <label for="name">Item Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="description">Description:</label>
            <textarea id="description" name="description" required></textarea>

            <label for="price">Price:</label>
            <input type="number" id="price" name="price" step="1" required>

            <label for="vegeterian">
                <input type="checkbox" id="vegeterian" name="vegeterian"> Vegetarian
            </label>

            <label for="image_url">Image URL:</label>
            <input type="url" id="image_url" name="image_url" required>

            <button type="submit" style="float: right;" class="btn">Add Item</button>
            <button type="submit" style="float: left;" class="btn">
        <a href="javascript:history.back()">Go Back</a></button>
        </form>
    </div>
</body>
</html>
